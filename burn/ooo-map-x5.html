var MODE = 5;

var MAX_OPEN = 5;
function getDeviceId(){
  try {
    var d = localStorage.getItem('burn_dev');
    if(!d){ d = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('burn_dev', d); }
    return d;
  } catch(e){ return 'local'; }
}
function lockKey(k){ return 'b5_' + k.substring(0, 24); }
function checkAllow(k){
  try {
    var lk = lockKey(k);
    var dev = getDeviceId();
    var owner = localStorage.getItem(lk + '_dev');
    if(owner && owner !== dev) return false;   // 其他设备：转发无效
    if(!owner) localStorage.setItem(lk + '_dev', dev);
    var cnt = parseInt(localStorage.getItem(lk + '_cnt') || '0', 10);
    if(cnt >= MAX_OPEN) return false;          // 超过5次
    return true;
  } catch(e){ return true; }
}
function applyAllow(k){
  try {
    var lk = lockKey(k);
    var dev = getDeviceId();
    var owner = localStorage.getItem(lk + '_dev');
    if(!owner){ localStorage.setItem(lk + '_dev', dev); }
    var cnt = parseInt(localStorage.getItem(lk + '_cnt') || '0', 10);
    localStorage.setItem(lk + '_cnt', String(cnt + 1));
  } catch(e){}
}

function b64uDecode(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  var bin = atob(s);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function b64Decode(s){
  var bin = atob(s);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function showErr(){
  var e = document.getElementById('err');
  e.style.display = 'flex';
  document.getElementById('view').style.display = 'none';
}
async function unlock(){
  var keyStr = location.hash.slice(1);
  if(!keyStr){ showErr(); return; }
  var keyBytes;
  try { keyBytes = b64uDecode(keyStr); } catch(e){ showErr(); return; }
  var burnId = keyStr.substring(0, 24);
  if (MODE === 5) {
    if (!checkAllow(burnId)) { showErr(); return; }
  } else {
    if (isBurned(burnId)) { showErr(); return; }
  }
  try {
    var key = await crypto.subtle.importKey('raw', keyBytes, {name:'AES-GCM'}, false, ['decrypt']);
    var plain = null;
    for (var i = 0; i < CIPHERS.length; i++) {
      try {
        var iv = b64Decode(CIPHERS[i][0]);
        var ct = b64Decode(CIPHERS[i][1]);
        plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, ct);
        break;
      } catch(e) {}
    }
    if (plain === null) { showErr(); return; }
    if (MODE === 5) {
      applyAllow(burnId);
    } else {
      markBurned(burnId);
    }
    history.replaceState(null, '', location.pathname + location.search);
    var view = document.getElementById('view');
    view.srcdoc = new TextDecoder().decode(plain);
  } catch(e) {
    showErr();
  }
}
unlock();
