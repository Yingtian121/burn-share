function b64uDecode(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  var bin = atob(s);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function b64Decode(s){
  var bin = atob(s);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function showErr(t){
  var e = document.getElementById('err');
  document.getElementById('errText').textContent = t;
  e.style.display = 'flex';
  document.getElementById('view').style.display = 'none';
}
function isBurned(k){
  try { return !!localStorage.getItem('burned_' + k); } catch(e){ return false; }
}
function markBurned(k){
  try { localStorage.setItem('burned_' + k, '1'); } catch(e){}
}
async function unlock(){
  var keyStr = location.hash.slice(1);
  if(!keyStr){ showErr('阅后即焚链接仅可打开一次，且转发无效'); return; }
  var keyBytes;
  try { keyBytes = b64uDecode(keyStr); } catch(e){ showErr('链接无效'); return; }
  // 焚毁检查：同一浏览器内此密钥已用过则拒绝
  var burnId = keyStr.substring(0, 24);
  if (isBurned(burnId)) { showErr('链接已失效：阅后即焚链接仅可打开一次'); return; }
  try {
    var key = await crypto.subtle.importKey('raw', keyBytes, {name:'AES-GCM'}, false, ['decrypt']);
    var plain = null;
    for (var i = 0; i < CIPHERS.length; i++) {
      try {
        var iv = b64Decode(CIPHERS[i][0]);
        var ct = b64Decode(CIPHERS[i][1]);
        plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, ct);
        break;
      } catch(e) { /* 密钥不匹配，尝试下一个 */ }
    }
    if (plain === null) { showErr('链接已失效或已被使用，无法再次查看'); return; }
    // 立即写入焚毁标记 + 清除地址栏密钥
    markBurned(burnId);
    history.replaceState(null, '', location.pathname + location.search);
    var view = document.getElementById('view');
    view.srcdoc = new TextDecoder().decode(plain);
  } catch(e) {
    showErr('链接已失效或已被使用，无法再次查看');
  }
}
unlock();
