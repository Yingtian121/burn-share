  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function showErr(){
  var e = document.getElementById('err');
  e.style.display = 'flex';
  document.getElementById('view').style.display = 'none';
}
async function unlock(){
  var keyStr = location.hash.slice(1);
  if(!keyStr){ showErr(); return; }
  var keyBytes;
  try { keyBytes = b64uDecode(keyStr); } catch(e){ showErr(); return; }
  var burnId = keyStr.substring(0, 24);
  if (MODE === 5) {
    if (!checkAllow(burnId)) { showErr(); return; }
  } else {
    if (isBurned(burnId)) { showErr(); return; }
  }
  try {
    var key = await crypto.subtle.importKey('raw', keyBytes, {name:'AES-GCM'}, false, ['decrypt']);
    var plain = null;
    for (var i = 0; i < CIPHERS.length; i++) {
      try {
        var iv = b64Decode(CIPHERS[i][0]);
        var ct = b64Decode(CIPHERS[i][1]);
        plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, ct);
        break;
      } catch(e) {}
    }
    if (plain === null) { showErr(); return; }
    if (MODE === 5) { applyAllow(burnId); } else { markBurned(burnId); }
    history.replaceState(null, '', location.pathname + location.search);
    var view = document.getElementById('view');
    view.srcdoc = new TextDecoder().decode(plain);
  } catch(e) { showErr(); }
}
unlock();
</script>
